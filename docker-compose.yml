services:
  db:
    image: postgres:15-alpine
    container_name: visual-ai-db
    environment:
      POSTGRES_USER: visual_user
      POSTGRES_PASSWORD: visual_password
      POSTGRES_DB: visual_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
