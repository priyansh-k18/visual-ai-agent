version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: visual-ai-db
    environment:
      POSTGRES_USER: visual_user
      POSTGRES_PASSWORD: visual_password
      POSTGRES_DB: visual_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build: 
      context: .
      dockerfile: server/Dockerfile
    container_name: visual-ai-server
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://visual_user:visual_password@db:5432/visual_db?schema=public
      - JWT_SECRET=super-secret-key-for-jwt
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: visual-ai-dashboard
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
